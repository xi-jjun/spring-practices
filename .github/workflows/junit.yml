# This workflow uses actions that are not certified by GitHub.  They are
# provided by a third-party and are governed by separate terms of service,
# privacy policy, and support documentation.
#
# This workflow will install a prebuilt Ruby version, install dependencies, and
# run tests and linters.
name: "Run JUnit test"
on:
  push:
    branches: [ "*" ]
    paths:
      - .github/workflows/rubyonrails.yml
      - spring-junit/**
  pull_request:
    branches: [ "master", "develop" ]
    paths:
      - '.github/workflows/junit.yml'
      - 'spring-junit/**'
jobs:
  run-junit:
    runs-on: ubuntu-latest

    # Github actions permissions (PR comment에 테스트 결과 리포팅을 위해 필수)
    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Set spring-junit source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ignore cache
      # Add or replace dependency steps here
      - name: Install JDK 17
        uses: actions/setup-java@v4.6.0
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./spring-junit

      - name: Build test
        run: ./gradlew clean test
        working-directory: ./spring-junit

      - name: test marketplace
        if: failure()
        uses: 'xi-jjun/rspec-reporter@feature/#21_add_junit_testframework'
        with:
          filepath: './spring-junit/build/test-results/cases' # test result file dir
          test-framework: 'junit'
        env:
          GITHUB_TOKEN: ${{ secrets.CREATE_ISSUE_GITHUB_TOKEN }}
